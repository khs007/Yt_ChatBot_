<!DOCTYPE html>
<html>
<head>
  <title>YouTube Transcript Chatbot</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

</head>
<body>

  <h1 id="head">

  <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png" alt="YouTube Logo" class="yt-logo">
  Chatbot
</h1>

  <form id="questionForm">
    
    <textarea id="question" placeholder="Ask anything" required></textarea>

    <button type="submit" id="askbtn">Ask</button>
  </form>
  <p id="responseBox"></p>

  <script src="popup.js"></script>
</body>
</html>
